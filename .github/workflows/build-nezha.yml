name: Build nezha kernel

# Builds the stock-identical AnyKernel3 zip. The identity gates (banner,
# /proc/config.gz, clang build id) run from in-repo data. The per-module CRC
# gate needs the stock vendor .ko set, which is NOT public: it is pulled from a
# private store over a read-only SSH deploy key when the STOCK_REPO_SSH +
# STOCK_SSH_KEY secrets are set, otherwise that one gate is skipped (SKIP_CRC)
# and the rest still run.

on:
  workflow_dispatch:
  push:
    branches: [ nezha-kernel ]
    paths-ignore: [ '**/*.md' ]

concurrency:
  group: build-nezha-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TC: ${{ github.workspace }}/toolchain-k2025
      ABT: ${{ github.workspace }}/aosp-build-tools
      STOCK_ROOT: ${{ github.workspace }}/stock-modules
    steps:
      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          path: nezha-kernel
          fetch-depth: 1

      - name: Checkout KernelSU (our selinux branch)
        uses: actions/checkout@v4
        with:
          repository: mexusbg/BakaSU
          ref: selinux-timing-3936-413
          path: KernelSU
          fetch-depth: 1

      - name: Wire KernelSU into the tree
        run: ln -sf ../../KernelSU/kernel nezha-kernel/drivers/kernelsu

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install host packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev zlib1g-dev ccache cpio rsync zip \
            python3 git curl xz-utils

      - name: Fetch AOSP toolchain (clang-r536225, main-kernel-2025)
        run: |
          # clang prebuilt from the AOSP main-kernel-2025 manifest.
          mkdir -p "$TC/clang"
          BASE=https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive
          curl -fL "$BASE/refs/heads/main-kernel-2025/clang-r536225.tar.gz" -o clang.tgz
          tar -xzf clang.tgz -C "$TC/clang"
          echo "$TC/clang/bin" >> "$GITHUB_PATH"
          # rust + bindgen from the same manifest if the build needs them
          "$TC/clang/bin/clang" --version | head -1

      - name: Fetch AOSP build-tools pahole
        run: |
          mkdir -p "$ABT"
          BASE=https://android.googlesource.com/kernel/prebuilts/build-tools/+archive
          curl -fL "$BASE/refs/heads/main-kernel-2025/linux-x86.tar.gz" -o bt.tgz
          tar -xzf bt.tgz -C "$ABT"
          test -x "$ABT/bin/pahole"

      - name: Build host elfutils with zstd
        working-directory: nezha-kernel
        run: ELFUTILS_PREFIX="$HOME/toolchain/elfutils" bash nezha/build-elfutils.sh || true

      - name: Pull stock vendor modules (private; optional)
        id: stock
        env:
          STOCK_REPO_SSH: ${{ secrets.STOCK_REPO_SSH }}
          STOCK_SSH_KEY: ${{ secrets.STOCK_SSH_KEY }}
        run: |
          if [ -n "$STOCK_REPO_SSH" ] && [ -n "$STOCK_SSH_KEY" ]; then
            mkdir -p ~/.ssh && chmod 700 ~/.ssh
            printf '%s\n' "$STOCK_SSH_KEY" > ~/.ssh/stock_ro && chmod 600 ~/.ssh/stock_ro
            ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
            GIT_SSH_COMMAND="ssh -i ~/.ssh/stock_ro -o IdentitiesOnly=yes" \
              git clone --depth 1 "$STOCK_REPO_SSH" "$STOCK_ROOT"
            # extract the per-firmware module tarball(s) in place next to them,
            # so $STOCK_ROOT/<fw>/modules/ is what build.sh's CRC gate reads
            for t in "$STOCK_ROOT"/*/modules.tar.xz; do
              tar -C "$(dirname "$t")" -xf "$t"
            done
            rm -f ~/.ssh/stock_ro
            echo "have_stock=1" >> "$GITHUB_OUTPUT"
          else
            echo "No stock-modules store configured; module CRC gate will be skipped." >&2
            echo "have_stock=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Clone AnyKernel3 (arm64 tools)
        run: git clone --depth 1 https://github.com/mexusbg/AnyKernel3 "$HOME/AnyKernel3" || git clone --depth 1 https://github.com/osm0sis/AnyKernel3 "$HOME/AnyKernel3"

      - name: Build
        working-directory: nezha-kernel
        env:
          TC: ${{ env.TC }}
          AOSP_BUILD_TOOLS: ${{ env.ABT }}
          STOCK_ROOT: ${{ env.STOCK_ROOT }}
          AK3_SRC: ${{ env.HOME }}/AnyKernel3
          ELFUTILS_PREFIX: ${{ env.HOME }}/toolchain/elfutils
          SKIP_CRC: ${{ steps.stock.outputs.have_stock == '1' && '' || '1' }}
        run: bash nezha/build.sh

      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: nezha-kernel-zip
          path: nezha-kernel/dist/*.zip
          if-no-files-found: error
