name: Build nezha kernel

# Builds the stock-identical AnyKernel3 zip. The identity gates (banner,
# /proc/config.gz, clang build id) run from in-repo data. The per-module CRC
# gate needs the stock vendor .ko set, which is NOT public: it is pulled from a
# private store over a read-only SSH deploy key when the STOCK_REPO_SSH +
# STOCK_SSH_KEY secrets are set, otherwise that one gate is skipped (SKIP_CRC)
# and the rest still run.

on:
  workflow_dispatch:
  push:
    branches: [ nezha-kernel ]
    paths-ignore: [ '**/*.md' ]

concurrency:
  group: build-nezha-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TC: ${{ github.workspace }}/toolchain-k2025
      ABT: ${{ github.workspace }}/aosp-build-tools
      STOCK_ROOT: ${{ github.workspace }}/stock-modules
      ELFUTILS_PREFIX: ${{ github.workspace }}/elfutils
      AK3_SRC: ${{ github.workspace }}/AnyKernel3
      BINDGEN_DIR: ${{ github.workspace }}/bindgen
    steps:
      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          path: nezha-kernel
          fetch-depth: 1

      - name: Checkout KernelSU (our selinux branch)
        uses: actions/checkout@v4
        with:
          repository: mexusbg/BakaSU
          ref: selinux-timing-3936-413
          path: KernelSU
          fetch-depth: 1

      - name: Wire KernelSU into the tree
        run: ln -sf ../../KernelSU/kernel nezha-kernel/drivers/kernelsu

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install host packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev zlib1g-dev ccache cpio rsync zip \
            python3 git curl xz-utils

      - name: Fetch AOSP toolchain (clang-r536225 + rust 1.82.0.p2 + bindgen, main-kernel-2025)
        run: |
          # Prebuilts from the AOSP main-kernel-2025 manifest, matching stock.
          G=https://android.googlesource.com; REF=refs/heads/main-kernel-2025
          mkdir -p "$TC/clang" "$TC/rust" "$BINDGEN_DIR"
          # clang
          curl -fL "$G/platform/prebuilts/clang/host/linux-x86/+archive/$REF/clang-r536225.tar.gz" -o clang.tgz
          tar -xzf clang.tgz -C "$TC/clang"
          echo "$TC/clang/bin" >> "$GITHUB_PATH"
          # rust (stock kernel's exact toolchain) -> $TC/rust/bin/rustc; must win
          # over the runner's system rustc, which build.sh ensures via PATH order.
          curl -fL "$G/platform/prebuilts/rust/+archive/$REF/linux-x86/1.82.0.p2.tar.gz" -o rust.tgz
          tar -xzf rust.tgz -C "$TC/rust"
          # bindgen is a single prebuilt binary in clang-tools (no archive for one
          # file; fetch the blob base64 and decode). clang-sys finds libclang via
          # $TC/clang/bin on PATH, so no LIBCLANG_PATH needed.
          curl -fsSL "$G/platform/prebuilts/clang-tools/+/$REF/linux-x86/bin/bindgen?format=TEXT" | base64 -d > "$BINDGEN_DIR/bindgen"
          chmod +x "$BINDGEN_DIR/bindgen"
          "$TC/clang/bin/clang" --version | head -1
          "$TC/rust/bin/rustc" --version

      - name: Fetch AOSP build-tools pahole
        run: |
          mkdir -p "$ABT"
          BASE=https://android.googlesource.com/kernel/prebuilts/build-tools/+archive
          curl -fL "$BASE/refs/heads/main-kernel-2025/linux-x86.tar.gz" -o bt.tgz
          tar -xzf bt.tgz -C "$ABT"
          test -x "$ABT/bin/pahole"

      - name: Build host elfutils with zstd
        working-directory: nezha-kernel
        run: bash nezha/build-elfutils.sh

      - name: Pull stock vendor modules (private; optional)
        id: stock
        env:
          STOCK_REPO_SSH: ${{ secrets.STOCK_REPO_SSH }}
          STOCK_SSH_KEY: ${{ secrets.STOCK_SSH_KEY }}
        run: |
          if [ -n "$STOCK_REPO_SSH" ] && [ -n "$STOCK_SSH_KEY" ]; then
            mkdir -p ~/.ssh && chmod 700 ~/.ssh
            printf '%s\n' "$STOCK_SSH_KEY" > ~/.ssh/stock_ro && chmod 600 ~/.ssh/stock_ro
            ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
            GIT_SSH_COMMAND="ssh -i ~/.ssh/stock_ro -o IdentitiesOnly=yes" \
              git clone --depth 1 "$STOCK_REPO_SSH" "$STOCK_ROOT"
            # extract the per-firmware module tarball(s) in place next to them,
            # so $STOCK_ROOT/<fw>/modules/ is what build.sh's CRC gate reads
            for t in "$STOCK_ROOT"/*/modules.tar.xz; do
              tar -C "$(dirname "$t")" -xf "$t"
            done
            rm -f ~/.ssh/stock_ro
            # leave skip_crc unset (empty) -> build.sh runs the CRC gate
          else
            echo "No stock-modules store configured; module CRC gate will be skipped." >&2
            echo "skip_crc=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Clone AnyKernel3 (arm64 tools)
        run: git clone --depth 1 https://github.com/mexusbg/AnyKernel3 "$AK3_SRC" || git clone --depth 1 https://github.com/osm0sis/AnyKernel3 "$AK3_SRC"

      - name: Build
        working-directory: nezha-kernel
        env:
          AOSP_BUILD_TOOLS: ${{ env.ABT }}
          SKIP_CRC: ${{ steps.stock.outputs.skip_crc }}
        run: bash nezha/build.sh

      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: nezha-kernel-zip
          path: nezha-kernel/dist/*.zip
          if-no-files-found: error
